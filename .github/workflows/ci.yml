name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check
      - name: Install ChatGPT app dependencies
        working-directory: apps/chatgpt
        run: npm install
      - name: Check ChatGPT app
        working-directory: apps/chatgpt
        run: npm run check
      - name: Smoke test ChatGPT MCP server
        working-directory: apps/chatgpt
        run: |
          npm start > /tmp/ghostwriter-chatgpt.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 3
          curl --fail --silent http://localhost:8788/health
      - name: Install Cloudflare target dependencies
        working-directory: apps/cloudflare
        run: npm install
      - name: Type-check Cloudflare target
        working-directory: apps/cloudflare
        run: npm run check
