name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check
      - name: Install ChatGPT app dependencies
        working-directory: apps/chatgpt
        run: npm ci
      - name: Check ChatGPT app
        working-directory: apps/chatgpt
        run: npm run check
      - name: Test authenticated Node MCP initialize and tools/list
        working-directory: apps/chatgpt
        run: npm test
      - name: Install Cloudflare target dependencies
        working-directory: apps/cloudflare
        run: npm ci
      - name: Type-check Cloudflare target
        working-directory: apps/cloudflare
        run: npm run check
      - name: Cloudflare behavior and OAuth MCP tests
        working-directory: apps/cloudflare
        run: npm test
      - name: Bundle Cloudflare Worker without deployment
        working-directory: apps/cloudflare
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run
